[opener]
edit = [
    { run = 'vim "%s"', block = true, for = "unix" }
]
code = [
    { run = 'code "%s"', orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    { mime = "text/*", use = [ "edit", "code" ] },
    { url = "*.conf", use = [ "edit", "code" ] },
    { url = "*.json", use = [ "edit", "code" ] },
    { url = "*.toml", use = [ "edit", "code" ] },
    { url = "*.sh", use = [ "edit", "code" ] },
    { url = "*.lua", use = [ "edit", "code" ] }
]
